<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Sanad</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tablet.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sanad">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <img src="logo.png" alt="Sanad" class="brand-logo">
                    <span class="brand-text">Sanad</span>
                </div>
                <button class="new-chat-btn" id="new-chat">
                    <span class="plus">＋</span>
                    <span>محادثة جديدة</span>
                </button>
            </div>

            <div class="sidebar-list" id="chat-list">
                <div class="chat-item active">
                    <span class="chat-icon">💬</span>
                    <span class="chat-title">محادثة جديدة</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="login-btn" id="login-btn">
                    <span class="login-icon">👤</span>
                    <span>تسجيل دخول</span>
                </button>
            </div>
        </aside>

        <!-- Login Modal -->
        <div class="modal-overlay" id="login-modal">
            <div class="modal">
                <button class="modal-close" id="close-modal">✕</button>
                <div class="modal-header">
                    <img src="logo.png" alt="Sanad" class="modal-logo">
                    <h2 class="modal-title">تسجيل دخول Sanad</h2>
                    <p class="modal-subtitle">عشان نحفظ محادثاتك وتقدر ترجع لها في أي وقت</p>
                </div>

                <div class="modal-body">
                    <button class="login-option google">
                        <span class="login-option-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                        </span>
                        <span>المتابعة بحساب Google</span>
                    </button>

                    <button class="login-option phone">
                        <span class="login-option-icon">📱</span>
                        <span>المتابعة برقم الهاتف</span>
                    </button>
                </div>

                <div class="modal-footer">
                    <p>بتسجيلك، إنت موافق على شروط الاستخدام.</p>
                </div>
            </div>
        </div>

        <!-- Main -->
        <main class="main">
            <header class="header">
                <button class="toggle-sidebar" id="toggle-sidebar" title="القائمة">☰</button>
                <div class="header-title">Sanad</div>
                <div class="status" id="status">جاهز</div>
            </header>

            <!-- شاشة الترحيب -->
            <div class="welcome" id="welcome">
                <img src="logo.png" alt="Sanad" class="welcome-logo">
                <h1 class="welcome-title">Sanad</h1>
                <p class="welcome-tagline" id="welcome-tagline">سندك في رحلتك</p>
            </div>

            <!-- الشات -->
            <div class="chat hidden" id="chat"></div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="input" placeholder="اسأل Sanad..." rows="1"></textarea>
                    <button id="send" title="إرسال">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
                <!-- الأزرار المقترحة -->
                <div class="suggestions" id="suggestions"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
